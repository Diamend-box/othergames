name: Satisfactory planner (Windows build)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Fetch the save parser
        run: python scripts/fetch_parser.py
      - name: Run tests
        run: python -m pytest -q

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pytest
      - name: Fetch the save parser
        run: python scripts/fetch_parser.py
      - name: Run tests
        run: python -m pytest -q
      - name: Build the executable
        run: python scripts/build_exe.py
      - name: Smoke-test the executable
        run: python scripts/smoke_exe.py
      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: SatisfactoryPlanner-exe
          path: dist/SatisfactoryPlanner.exe
          if-no-files-found: error
